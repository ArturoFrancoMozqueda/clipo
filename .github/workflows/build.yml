# Builds Clipo on GitHub's machines, so nothing has to be installed locally.
# - Every push to main / PR: tests + web build, Windows .exe and Android .apk as downloadable artifacts.
# - A tag like v0.4.0: the same, plus a GitHub Release with the files attached.
# - "Run workflow" button (Actions tab): run it by hand.
#
# Optional secrets (Settings → Secrets and variables → Actions) to sign the Windows installer:
#   CSC_LINK (base64 of the .pfx or an https URL) and CSC_KEY_PASSWORD. Without them it builds unsigned.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Tests y build web
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit package-lock.json when it changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # `npm install` (not `npm ci`) keeps working while package-lock.json is behind package.json;
      # the step below commits the updated lockfile back to main.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test
      - run: npm run build
      - name: Guardar package-lock.json actualizado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update package-lock.json [skip ci]"
            git push
          fi

  windows:
    name: Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Firma (solo si hay certificado)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Sin certificado: el instalador sale sin firmar."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: clipo-windows
          path: release/build/*.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      # Debug build: installable for testing. A Play Store release needs your keystore (see PUBLICAR.md).
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: clipo-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/clipo-windows/*.exe
            out/clipo-android/*.apk
          generate_release_notes: true
