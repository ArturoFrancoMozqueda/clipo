# Publishes site/ (home page and privacy policy that Google and Meta link to) on GitHub Pages,
# plus the web app itself under /app/ so it can be opened and installed from a phone (iPhone: Safari →
# Compartir → Agregar a inicio).
name: Sitio

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'public/**', 'index.html', 'package.json', 'vite.config.ts', 'vercel.json', 'scripts/pages-app.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pages-app.mjs
      - run: cp public/icon.svg site/icon.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
